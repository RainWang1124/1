<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网站</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }
        header {
            background: #333;
            color: white;
            padding: 30px;
        }
        main {
            padding: 60px 20px;
        }
        h1 {
            color: #333;
        }
        button {
            background: #4285f4;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h2>欢迎来到我的网站</h2>
    </header>
    <main>
        <h1>你好，世界！</h1>
        <p>这是我创建的第一个网站。</p>
        <button onclick="alert('欢迎来到我的网站！')">
            点击我
        </button>
    </main>
</body>
</html>
