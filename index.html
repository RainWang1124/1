<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A personal digital identity — creative thinking, visual design, and new ideas.">
  <title>YOUR NAME — Digital Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>

  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --pad-x: clamp(20px, 6.95vw, 120px);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Poppins', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    body { min-width: 280px; }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }

    #scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
      outline: none;
    }

    #scene.dragging { cursor: grabbing; }

    .ui {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .ui a, .ui button { pointer-events: auto; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Personal wordmark */
    .nav {
      position: absolute;
      top: clamp(24px, 4.7vh, 40px);
      left: var(--pad-x);
      right: var(--pad-x);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: -.01em;
      white-space: nowrap;
    }

    .logo-mark {
      display: inline-block;
      width: 20px;
      height: 40px;
      flex: none;
      background: #fff;
      border-radius: 0 20px 20px 0;
    }

    .logo b { font-weight: 700; }
    .logo span { font-weight: 400; opacity: .8; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(20px, 4.1vw, 60px);
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-links a {
      position: relative;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -4px;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform .35s ease;
    }

    .nav-links a:hover::after,
    .nav-links a:focus-visible::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    /* Rotational controls */
    .arrows {
      position: absolute;
      top: 18.9%;
      left: 76.7%;
      display: flex;
      gap: 32px;
      transform: translate(-19px, -50%);
    }

    .arrow {
      width: 38px;
      height: 38px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 2.5px solid #fff;
      border-radius: 50%;
      background: transparent;
      color: #fff;
      cursor: pointer;
      transition: background .25s, color .25s;
    }

    .arrow svg { width: 18px; height: 18px; }
    .arrow:hover, .arrow:focus-visible { background: #fff; color: #000; }

    /* Vertical pagination */
    .dots {
      position: absolute;
      right: calc(var(--pad-x) - 7px);
      top: 49.4%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 33px;
    }

    .dot {
      width: 14px;
      height: 14px;
      padding: 0;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      transition: background .25s;
    }

    .dot.active { background: transparent; }

    /* Personal statement */
    .tagline {
      position: absolute;
      left: var(--pad-x);
      bottom: clamp(40px, 7.5vh, 70px);
      margin: 0;
      font-size: clamp(24px, 2.65vw, 44px);
      line-height: 1.2;
      font-weight: 300;
      letter-spacing: -.01em;
    }

    .tagline strong { display: block; font-weight: 700; }

    /* Contact action and oversized index */
    .cta-row {
      position: absolute;
      left: 45.6%;
      right: -1vw;
      top: 88.7%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
    }

    .cta {
      flex: none;
      height: 48px;
      padding: 0 15px;
      display: inline-flex;
      align-items: center;
      border: 1.5px solid rgba(255,255,255,.85);
      border-radius: 6px;
      background: rgba(0,0,0,.15);
      color: #fff;
      font-size: 14px;
      font-weight: 400;
      text-decoration: none;
      white-space: nowrap;
      transition: background .25s, color .25s;
    }

    .cta:hover, .cta:focus-visible { background: #fff; color: #000; }

    .cta-line {
      flex: 1;
      min-width: 40px;
      height: 1.5px;
      background: rgba(255,255,255,.8);
    }

    .count {
      flex: none;
      color: transparent;
      font-size: clamp(140px, 19.8vw, 360px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -.02em;
      -webkit-text-stroke: 1.5px rgba(255,255,255,.9);
      transform: translateY(6%);
      user-select: none;
    }

    .loader {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: .6;
      white-space: nowrap;
      transition: opacity .6s;
    }

    .loader.done { opacity: 0; pointer-events: none; }

    .loader.error {
      top: auto;
      bottom: 12px;
      opacity: .7;
      letter-spacing: .04em;
      font-size: 10px;
    }

    @media (max-width: 900px), (max-aspect-ratio: 1/1) {
      .arrows {
        left: auto;
        right: var(--pad-x);
        top: 15%;
        transform: translateY(-50%);
        gap: 14px;
      }

      .tagline { bottom: clamp(150px, 20vh, 220px); }

      .cta-row {
        left: var(--pad-x);
        right: -3vw;
        top: auto;
        bottom: 24px;
        transform: none;
      }

      .count { font-size: clamp(120px, 22vw, 200px); }
    }

    @media (max-width: 640px) {
      .nav-links { gap: 16px; }
      .nav-links a, .logo { font-size: 13px; }
      .dots { gap: 20px; right: 16px; }
      .dot { width: 10px; height: 10px; }
      .cta-row { right: -8vw; }
      .count { font-size: 120px; }
    }

    @media (max-width: 420px) {
      .nav-links li:nth-child(2) { display: none; }
      .logo { gap: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .nav-links a::after, .arrow, .dot, .cta, .loader { transition-duration: 0s; }
    }
  </style>
</head>
<body>
  <section class="hero" id="hero">
    <canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate." tabindex="0"></canvas>

    <div class="ui">
      <h1 class="sr-only">Your Name — Creative Digital Portfolio</h1>

      <header class="nav">
        <!-- Replace YOUR NAME with your own name or personal brand. -->
        <a href="#hero" class="logo" aria-label="Your name home">
          <i class="logo-mark" aria-hidden="true"></i>
          <b>YOUR</b><span>NAME</span>
        </a>

        <ul class="nav-links">
          <li><a href="#hero">Home</a></li>
          <li><a href="#hero" id="portfolioLink">Portfolio</a></li>
          <!-- Replace the email address with your own contact email. -->
          <li><a href="mailto:hello@example.com">Contact</a></li>
        </ul>
      </header>

      <div class="arrows" aria-label="Rotate the glass cube">
        <button class="arrow" id="prev" type="button" aria-label="Rotate left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5M11 6l-6 6 6 6"/>
          </svg>
        </button>
        <button class="arrow" id="next" type="button" aria-label="Rotate right">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </button>
      </div>

      <nav class="dots" aria-label="Visual index">
        <button class="dot" type="button" aria-label="Visual 1"></button>
        <button class="dot active" type="button" aria-label="Visual 2" aria-current="true"></button>
        <button class="dot" type="button" aria-label="Visual 3"></button>
      </nav>

      <p class="tagline">
        Creative Mind.<br>
        Digital Vision.<strong>Always Exploring.</strong>
      </p>

      <div class="cta-row">
        <a href="mailto:hello@example.com" class="cta">Let's Connect</a>
        <span class="cta-line" aria-hidden="true"></span>
        <span class="count" aria-hidden="true">01</span>
      </div>

      <div class="loader" id="loader" role="status" aria-live="polite">Loading glass model</div>
    </div>
  </section>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import {
      mergeVertices,
      mergeGeometries
    } from 'three/addons/utils/BufferGeometryUtils.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    // ------------------------------------------------------------
    // Personal settings — edit these values to personalize the page.
    // ------------------------------------------------------------
    const PROFILE = {
      displayName: 'YOUR NAME',
      email: 'hello@example.com',
      headline: ['YOUR', 'NAME', 'HERE']
    };

    const MODEL_URL = 'https://motionsites.org/assets/prompt-media/fa96096e78c8153a70d2.glb';

    const canvas = document.getElementById('scene');
    const loaderElement = document.getElementById('loader');
    const fov = 30;
    const cameraDistance = 10;

    let width = window.innerWidth;
    let height = window.innerHeight;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let mobile = false;
    let cube = null;
    let pivot = null;
    let spinner = null;

    let dragging = false;
    let pointerX = 0;
    let pointerY = 0;
    let velocityX = 0;
    let velocityY = 0;
    let lastReleaseTime = 0;
    let idleBlend = 0;
    let spinRemaining = 0;
    let previousTime = 0;
    let animationStarted = false;

    // Keep visible labels in sync with the personal settings.
    document.title = `${PROFILE.displayName} — Digital Portfolio`;
    document.querySelector('.logo b').textContent = PROFILE.displayName.split(/\s+/)[0] || 'YOUR';
    document.querySelector('.logo span').textContent = PROFILE.displayName.split(/\s+/).slice(1).join(' ') || 'NAME';
    document.querySelector('.logo').setAttribute('aria-label', `${PROFILE.displayName} home`);
    document.querySelectorAll('a[href="mailto:hello@example.com"]').forEach(link => {
      link.href = `mailto:${PROFILE.email}`;
    });

    // ------------------------------------------------------------
    // Renderer and cameras
    // ------------------------------------------------------------
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
      });
    } catch (error) {
      console.error('WebGL initialization failed:', error);
      loaderElement.textContent = 'WebGL is not available in this browser';
      loaderElement.classList.add('error');
      throw error;
    }

    renderer.setClearColor(0x000000, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setPixelRatio(dpr);
    renderer.setSize(width, height, false);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(fov, width / height, 0.1, 100);
    camera.position.set(0, 0, cameraDistance);
    camera.lookAt(0, 0, 0);

    // ------------------------------------------------------------
    // Offscreen 2D headline rendered as a WebGL background texture.
    // This is intentionally not HTML text: the glass refracts it.
    // ------------------------------------------------------------
    const textCanvas = document.createElement('canvas');
    const textContext = textCanvas.getContext('2d');
    const headlineTexture = new THREE.CanvasTexture(textCanvas);
    headlineTexture.colorSpace = THREE.SRGBColorSpace;
    headlineTexture.minFilter = THREE.LinearFilter;
    headlineTexture.magFilter = THREE.LinearFilter;
    headlineTexture.generateMipmaps = false;

    const bgScene = new THREE.Scene();
    const bgCamera = new THREE.Camera();

    const bgMaterial = new THREE.ShaderMaterial({
      uniforms: { uTex: { value: headlineTexture } },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D uTex;
        varying vec2 vUv;
        void main() {
          gl_FragColor = texture2D(uTex, vUv);
          #include <colorspace_fragment>
        }
      `,
      depthTest: false,
      depthWrite: false
    });

    const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMaterial);
    bgQuad.frustumCulled = false;
    bgScene.add(bgQuad);

    function drawHeadline() {
      if (!textContext) return;

      textCanvas.width = Math.max(1, Math.round(width * dpr));
      textCanvas.height = Math.max(1, Math.round(height * dpr));
      textContext.setTransform(dpr, 0, 0, dpr, 0, 0);
      textContext.fillStyle = '#000000';
      textContext.fillRect(0, 0, width, height);

      mobile = width < 768 || width / height < 1;
      const lines = PROFILE.headline;
      let fs = Math.min(height * 0.21, width * (mobile ? 0.21 : 0.118));

      textContext.textAlign = 'center';
      textContext.textBaseline = 'alphabetic';
      textContext.font = `800 ${fs}px Poppins`;

      const widest = Math.max(...lines.map(line => textContext.measureText(line).width));
      const maxWidth = width * (mobile ? 0.9 : 0.5);
      if (widest > maxWidth) fs *= maxWidth / widest;

      textContext.font = `800 ${fs}px Poppins`;
      textContext.fillStyle = '#e9e9e9';

      const cx = width * (mobile ? 0.5 : 0.505);
      const cy = height * (mobile ? 0.45 : 0.468);
      const gap = fs * 1.07;
      const capHeight = fs * 0.7;

      lines.forEach((line, index) => {
        const baseline = cy + capHeight / 2 + (index - 1) * gap;
        textContext.fillText(line, cx, baseline);
      });

      headlineTexture.needsUpdate = true;
    }

    // ------------------------------------------------------------
    // Screen-space glass refraction shader, with six spectral bands.
    // ------------------------------------------------------------
    const glassVertexShader = `
      varying vec3 vNormal;
      varying vec3 vEye;
      void main() {
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vec4 mvPos = viewMatrix * worldPos;
        gl_Position = projectionMatrix * mvPos;
        vNormal = normalize(normalMatrix * normal);
        vEye = normalize(mvPos.xyz);
      }
    `;

    const glassFragmentShader = `
      uniform sampler2D uTexture;
      uniform vec2 uResolution;
      uniform float uIorR;
      uniform float uIorY;
      uniform float uIorG;
      uniform float uIorC;
      uniform float uIorB;
      uniform float uIorP;
      uniform float uRefractPower;
      uniform float uChromatic;
      uniform float uSaturation;
      uniform float uShininess;
      uniform float uDiffuseness;
      uniform float uFresnelPower;
      uniform vec3 uLight;
      uniform float uBackside;

      varying vec3 vNormal;
      varying vec3 vEye;

      vec3 refractedSample(vec2 uv, vec3 n, vec3 eye, float ior, float slide, float k) {
        vec3 refr = refract(eye, n, 1.0 / ior);
        vec2 sampleUv = uv + refr.xy * (uRefractPower + slide * k) * uChromatic;
        return texture2D(uTexture, sampleUv).rgb;
      }

      float phongSpecular(vec3 lightDirection, float shininess, float diffuseness, vec3 n, vec3 eye) {
        vec3 lightVec = normalize(-lightDirection);
        vec3 viewVec = -eye;
        vec3 halfVec = normalize(lightVec + viewVec);
        return pow(max(dot(n, halfVec), 0.0), shininess)
          + max(0.0, dot(n, lightVec)) * diffuseness;
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / uResolution;
        vec3 n = normalize(vNormal);
        if (uBackside > 0.5) n = -n;
        vec3 eye = normalize(vEye);

        const int LOOP = 16;
        vec3 color = vec3(0.0);

        for (int i = 0; i < LOOP; i++) {
          float slide = float(i) / float(LOOP) * 0.045;

          vec3 texR = refractedSample(uv, n, eye, uIorR, slide, 1.0);
          vec3 texY = refractedSample(uv, n, eye, uIorY, slide, 1.0);
          vec3 texG = refractedSample(uv, n, eye, uIorG, slide, 2.0);
          vec3 texC = refractedSample(uv, n, eye, uIorC, slide, 2.5);
          vec3 texB = refractedSample(uv, n, eye, uIorB, slide, 3.0);
          vec3 texP = refractedSample(uv, n, eye, uIorP, slide, 1.0);

          float r = texR.r * 0.5;
          float y = (texY.r * 2.0 + texY.g * 2.0 - texY.b) / 6.0;
          float g = texG.g * 0.5;
          float c = (texC.g * 2.0 + texC.b * 2.0 - texC.r) / 6.0;
          float b = texB.b * 0.5;
          float p = (texP.b * 2.0 + texP.r * 2.0 - texP.g) / 6.0;

          float R = r + (2.0 * p + 2.0 * y - c) / 3.0;
          float G = g + (2.0 * y + 2.0 * c - p) / 3.0;
          float B = b + (2.0 * c + 2.0 * p - y) / 3.0;
          color += vec3(R, G, B);
        }

        color /= float(LOOP);
        float luma = dot(color, vec3(0.2125, 0.7154, 0.0721));
        color = mix(vec3(luma), color, uSaturation);

        float spec = phongSpecular(uLight, uShininess, uDiffuseness, n, eye)
          + 0.6 * phongSpecular(vec3(1.0, 1.0, -1.0), uShininess * 0.6, uDiffuseness * 0.5, n, eye);
        color += spec * (uBackside > 0.5 ? 0.35 : 1.0);

        float fresnel = pow(max(0.0, 1.0 + dot(eye, n)), uFresnelPower);
        color = mix(color, vec3(1.0), fresnel * (uBackside > 0.5 ? 0.25 : 0.55));
        color += vec3(0.004, 0.005, 0.007);

        gl_FragColor = vec4(color, 1.0);
        #include <colorspace_fragment>
      }
    `;

    function createGlassMaterial(backside = false) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uTexture: { value: null },
          uResolution: { value: new THREE.Vector2(1, 1) },
          uIorR: { value: 1.15 },
          uIorY: { value: 1.16 },
          uIorG: { value: 1.18 },
          uIorC: { value: 1.22 },
          uIorB: { value: 1.22 },
          uIorP: { value: 1.22 },
          uRefractPower: { value: backside ? 0.22 : 0.30 },
          uChromatic: { value: 0.5 },
          uSaturation: { value: 1.08 },
          uShininess: { value: 90 },
          uDiffuseness: { value: 0.02 },
          uFresnelPower: { value: 5.0 },
          uLight: { value: new THREE.Vector3(-1, 1, 1) },
          uBackside: { value: backside ? 1.0 : 0.0 }
        },
        vertexShader: glassVertexShader,
        fragmentShader: glassFragmentShader,
        side: backside ? THREE.BackSide : THREE.FrontSide,
        transparent: false,
        depthTest: true,
        depthWrite: true
      });
    }

    const frontMat = createGlassMaterial(false);
    const backMat = createGlassMaterial(true);

    // ------------------------------------------------------------
    // Two half-float render targets for the two-pass refraction.
    // ------------------------------------------------------------
    function createRenderTarget() {
      const target = new THREE.WebGLRenderTarget(1, 1, {
        type: THREE.HalfFloatType,
        depthBuffer: true,
        stencilBuffer: false,
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter
      });
      target.texture.generateMipmaps = false;
      return target;
    }

    const rtBack = createRenderTarget();
    const rtFront = createRenderTarget();
    backMat.uniforms.uTexture.value = rtBack.texture;
    frontMat.uniforms.uTexture.value = rtFront.texture;

    // ------------------------------------------------------------
    // Cube hierarchy: scene -> pivot -> spinner -> glass mesh.
    // ------------------------------------------------------------
    pivot = new THREE.Group();
    spinner = new THREE.Group();
    scene.add(pivot);
    pivot.add(spinner);

    function centerAndNormalize(geometry) {
      geometry.computeBoundingBox();
      const center = new THREE.Vector3();
      geometry.boundingBox.getCenter(center);
      geometry.translate(-center.x, -center.y, -center.z);
      geometry.computeBoundingBox();

      const size = new THREE.Vector3();
      geometry.boundingBox.getSize(size);
      const largest = Math.max(size.x, size.y, size.z);
      if (largest > 0) geometry.scale(1 / largest, 1 / largest, 1 / largest);

      geometry.computeVertexNormals();
      geometry.computeBoundingBox();
      return geometry;
    }

    function setCubeGeometry(geometry) {
      centerAndNormalize(geometry);
      if (cube) {
        spinner.remove(cube);
        cube.geometry.dispose();
      }
      cube = new THREE.Mesh(geometry, frontMat);
      cube.frustumCulled = true;
      spinner.add(cube);
      spinner.rotation.set(-0.42, 0.62, 0.18);
      layout();
      loaderElement.classList.add('done');
    }

    function useFallbackCube() {
      if (cube) return;
      const geometry = new RoundedBoxGeometry(1, 1, 1, 8, 0.12);
      setCubeGeometry(geometry);
    }

    // ------------------------------------------------------------
    // Load the supplied GLB. If it cannot be used, use the rounded box.
    // ------------------------------------------------------------
    const gltfLoader = new GLTFLoader();
    let modelResolved = false;

    const fallbackTimer = window.setTimeout(() => {
      if (!modelResolved) {
        console.warn('GLB is taking too long; showing the rounded-box fallback.');
        useFallbackCube();
      }
    }, 10000);

    gltfLoader.load(
      MODEL_URL,
      (gltf) => {
        modelResolved = true;
        clearTimeout(fallbackTimer);
        try {
          gltf.scene.updateMatrixWorld(true);
          const geometries = [];

          gltf.scene.traverse((object) => {
            if (!object.isMesh || !object.geometry) return;

            let geometry = object.geometry.clone();
            ['uv', 'color', 'tangent'].forEach(attribute => {
              if (geometry.hasAttribute(attribute)) geometry.deleteAttribute(attribute);
            });

            geometry = mergeVertices(geometry, 1e-4);
            geometry.applyMatrix4(object.matrixWorld);
            geometry.computeVertexNormals();
            geometries.push(geometry);
          });

          if (!geometries.length) throw new Error('No mesh geometry in GLB.');

          const merged = mergeGeometries(geometries, false);
          geometries.forEach(geometry => geometry.dispose());
          if (!merged) throw new Error('Could not merge GLB geometry.');

          setCubeGeometry(merged);
        } catch (error) {
          console.error('GLB processing failed; using fallback cube.', error);
          useFallbackCube();
        }
      },
      undefined,
      (error) => {
        modelResolved = true;
        clearTimeout(fallbackTimer);
        console.warn('GLB failed to load; using fallback cube.', error);
        useFallbackCube();
      }
    );

    // ------------------------------------------------------------
    // Layout and resize. Coordinates are based on camera view size.
    // ------------------------------------------------------------
    function layout() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      mobile = width < 768 || width / height < 1;

      renderer.setPixelRatio(dpr);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      const drawingBuffer = new THREE.Vector2();
      renderer.getDrawingBufferSize(drawingBuffer);
      const bufferWidth = Math.max(1, drawingBuffer.x);
      const bufferHeight = Math.max(1, drawingBuffer.y);

      rtBack.setSize(bufferWidth, bufferHeight);
      rtFront.setSize(bufferWidth, bufferHeight);
      const resolution = new THREE.Vector2(bufferWidth, bufferHeight);
      frontMat.uniforms.uResolution.value.copy(resolution);
      backMat.uniforms.uResolution.value.copy(resolution);

      drawHeadline();

      const visH = 2 * Math.tan(THREE.MathUtils.degToRad(fov / 2)) * cameraDistance;
      const visW = visH * camera.aspect;
      const sx = mobile ? 0.5 : 0.517;
      const sy = mobile ? 0.45 : 0.488;

      pivot.position.set(
        (sx - 0.5) * visW,
        (0.5 - sy) * visH,
        0
      );

      const px = Math.min(height * 0.44, width * (mobile ? 0.45 : 0.29));
      pivot.scale.setScalar((px / height) * visH);
    }

    window.addEventListener('resize', layout, { passive: true });

    if (document.fonts && document.fonts.addEventListener) {
      document.fonts.addEventListener('loadingdone', drawHeadline);
    }

    // ------------------------------------------------------------
    // Pointer drag, world-space rotation, and inertia.
    // ------------------------------------------------------------
    const axisY = new THREE.Vector3(0, 1, 0);
    const axisX = new THREE.Vector3(1, 0, 0);
    const qY = new THREE.Quaternion();
    const qX = new THREE.Quaternion();

    function rotateWorld(dx, dy) {
      qY.setFromAxisAngle(axisY, dx);
      qX.setFromAxisAngle(axisX, dy);
      spinner.quaternion.premultiply(qY);
      spinner.quaternion.premultiply(qX);
    }

    canvas.addEventListener('pointerdown', (event) => {
      if (!cube) return;
      dragging = true;
      pointerX = event.clientX;
      pointerY = event.clientY;
      velocityX = 0;
      velocityY = 0;
      spinRemaining = 0;
      idleBlend = 0;
      canvas.classList.add('dragging');
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener('pointermove', (event) => {
      if (!dragging || !spinner) return;
      const dx = event.clientX - pointerX;
      const dy = event.clientY - pointerY;
      pointerX = event.clientX;
      pointerY = event.clientY;
      const rotationX = dx * 0.008;
      const rotationY = dy * 0.008;
      rotateWorld(rotationX, rotationY);
      velocityX = rotationX;
      velocityY = rotationY;
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      canvas.classList.remove('dragging');
      lastReleaseTime = performance.now();
    }

    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('lostpointercapture', endDrag);

    // ------------------------------------------------------------
    // Arrow controls: ease to a quarter-turn.
    // ------------------------------------------------------------
    function startSpin(angle) {
      if (!spinner) return;
      velocityX = 0;
      velocityY = 0;
      spinRemaining += angle;
      idleBlend = 0;
      lastReleaseTime = performance.now();
    }

    document.getElementById('prev').addEventListener('click', () => startSpin(-Math.PI / 2));
    document.getElementById('next').addEventListener('click', () => startSpin(Math.PI / 2));

    // The three dots are visual pagination controls; the centre dot starts active.
    const dots = document.querySelectorAll('.dot');
    dots.forEach((dot, index) => {
      dot.addEventListener('click', () => {
        dots.forEach((item, i) => {
          const active = i === index;
          item.classList.toggle('active', active);
          if (active) item.setAttribute('aria-current', 'true');
          else item.removeAttribute('aria-current');
        });
      });
    });

    // ------------------------------------------------------------
    // Three-pass rendering: background -> back glass -> front glass.
    // ------------------------------------------------------------
    const idleQuaternionY = new THREE.Quaternion();
    const idleQuaternionX = new THREE.Quaternion();

    function animate(time) {
      requestAnimationFrame(animate);
      if (!previousTime) previousTime = time;
      const dt = Math.min((time - previousTime) / 1000, 0.05);
      previousTime = time;

      if (spinner && !dragging) {
        const frameFactor = dt * 60;

        if (Math.abs(spinRemaining) > 0.0005) {
          const step = spinRemaining * Math.min(1, 0.09 * frameFactor);
          rotateWorld(step, 0);
          spinRemaining -= step;
        } else {
          spinRemaining = 0;

          if (Math.abs(velocityX) > 0.00001 || Math.abs(velocityY) > 0.00001) {
            rotateWorld(velocityX, velocityY);
            const damping = Math.pow(0.94, frameFactor);
            velocityX *= damping;
            velocityY *= damping;
          }

          const timeSinceRelease = time - lastReleaseTime;
          if (timeSinceRelease > 600 || lastReleaseTime === 0) {
            idleBlend = Math.min(1, idleBlend + dt);
            const idleFactor = idleBlend * frameFactor;

            idleQuaternionY.setFromAxisAngle(axisY, 0.0035 * idleFactor);
            idleQuaternionX.setFromAxisAngle(axisX, 0.0012 * idleFactor);
            spinner.quaternion.premultiply(idleQuaternionY);
            spinner.quaternion.premultiply(idleQuaternionX);
          }
        }
      }

      // Pass 1: save the undistorted headline background.
      renderer.setRenderTarget(rtBack);
      renderer.autoClear = true;
      renderer.clear();
      renderer.render(bgScene, bgCamera);

      // Pass 2: draw the background, then the cube's back faces.
      renderer.setRenderTarget(rtFront);
      renderer.autoClear = true;
      renderer.clear();
      renderer.render(bgScene, bgCamera);
      if (cube) {
        cube.material = backMat;
        renderer.autoClear = false;
        renderer.render(scene, camera);
      }

      // Pass 3: draw the background, then refract through the front faces.
      renderer.setRenderTarget(null);
      renderer.autoClear = true;
      renderer.clear();
      renderer.render(bgScene, bgCamera);
      if (cube) {
        cube.material = frontMat;
        renderer.autoClear = false;
        renderer.clearDepth();
        renderer.render(scene, camera);
      }
      renderer.autoClear = true;
    }

    // Wait for the requested Poppins weights before the first headline draw.
    const fontReady = (document.fonts && document.fonts.load)
      ? Promise.all([document.fonts.load('800 100px Poppins'), document.fonts.ready])
      : Promise.resolve();
    const fontTimeout = new Promise(resolve => window.setTimeout(resolve, 2500));

    await Promise.race([fontReady, fontTimeout]);
    layout();
    if (!animationStarted) {
      animationStarted = true;
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
